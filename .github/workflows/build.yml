name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # needed to publish releases
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Build APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # optional release key, without it the APK is signed with a temporary debug key
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease
          cp build/outputs/apk/release/*.apk unbird.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-$GITHUB_RUN_NUMBER" unbird.apk --target "$GITHUB_SHA" --title "Unbird build $GITHUB_RUN_NUMBER" --notes "APK built from $GITHUB_SHA"
