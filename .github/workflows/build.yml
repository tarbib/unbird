name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push cancels the build of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # needed to publish the release
      contents: write
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Build APK
        run: |
          # optional release key, without it the APK is signed with a temporary debug key
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease
          cp build/outputs/apk/release/*.apk unbird.apk

      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # an update only installs over an APK signed with the same key
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD secrets to publish the APK"
            exit 1
          fi
          # the release is named after the version of the APK, so Obtainium sees every build as an update
          version=$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging unbird.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          gh release create "$version" unbird.apk --target "$GITHUB_SHA" --title "Unbird $version" --notes "APK built from $GITHUB_SHA" --latest
          # keep only this release
          gh release list --json tagName --jq '.[].tagName' | grep -vxF "$version" | xargs -r -n1 gh release delete --cleanup-tag --yes
